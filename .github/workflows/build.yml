name: RapidRAW - Enhanced Reusable Build

on:
  workflow_call:
    inputs:
      platform:
        description: GitHub-hosted runner label
        required: true
        type: string
      target:
        description: Rust compilation target
        required: true
        type: string
      asset-platform:
        description: Stable platform label used in artifact and release asset names
        required: true
        type: string
      build-args:
        description: Additional Tauri build arguments
        required: true
        type: string
      release-id:
        description: Existing GitHub release ID for release asset uploads
        required: false
        type: string
        default: ''
      upload-artifacts:
        description: Upload bundles as workflow artifacts
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: ${{ inputs.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ inputs.platform }}-${{ inputs.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - id: tauri-build
        name: Build and package application
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ runner.os == 'Linux' }}
        with:
          args: --verbose ${{ inputs.build-args }} --target ${{ inputs.target }}
          assetNamePattern: '[name]_v[version]_${{ inputs.asset-platform }}_[arch][ext]'
          releaseId: ${{ inputs.release-id }}
          retryAttempts: 3

      - name: Upload workflow artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RapidRAW-Enhanced-${{ inputs.target }}
          path: ${{ join(fromJSON(steps.tauri-build.outputs.artifactPaths), '\n') }}
          if-no-files-found: error
          retention-days: 7
