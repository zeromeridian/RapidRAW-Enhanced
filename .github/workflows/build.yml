name: ThisIsRAW Reusable Build

on:
  workflow_call:
    inputs:
      platform:
        description: GitHub-hosted runner label
        required: true
        type: string
      target:
        description: Rust compilation target
        required: true
        type: string
      asset-platform:
        description: Stable platform label used in artifact and release asset names
        required: true
        type: string
      build-args:
        description: Additional Tauri build arguments
        required: true
        type: string
      source-branch:
        description: Source branch used to derive the semantic-version suffix
        required: true
        type: string
      release-id:
        description: Existing GitHub release ID for release asset uploads
        required: false
        type: string
        default: ''
      upload-artifacts:
        description: Upload bundles as workflow artifacts
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    env:
      # The Tauri action launches the npm/Tauri wrapper again after the
      # explicit preparation step. Keep branch context available to that
      # detached-checkout subprocess on every supported platform.
      BUILD_BRANCH: ${{ inputs.source-branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: ${{ inputs.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ inputs.platform }}-${{ inputs.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply branch-qualified build version
        run: node scripts/prepare-build-version.mjs

      - name: Configure Apple signing and notarization
        if: runner.os == 'macOS' && inputs.release-id != ''
        shell: bash
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$SIGNING_CERTIFICATE" || -z "$SIGNING_CERTIFICATE_PASSWORD" ]]; then
            echo "Release signing requires APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          if [[ -z "$NOTARIZATION_APPLE_ID" || -z "$NOTARIZATION_PASSWORD" || -z "$NOTARIZATION_TEAM_ID" ]]; then
            echo "Release notarization requires APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID." >&2
            exit 1
          fi

          echo "APPLE_CERTIFICATE=$SIGNING_CERTIFICATE" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$SIGNING_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          if [[ -n "$SIGNING_IDENTITY" ]]; then
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          echo "APPLE_ID=$NOTARIZATION_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$NOTARIZATION_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$NOTARIZATION_TEAM_ID" >> "$GITHUB_ENV"

      - id: tauri-build
        name: Build and package application
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ runner.os == 'Linux' }}
        with:
          args: --verbose ${{ inputs.build-args }} --target ${{ inputs.target }}
          assetNamePattern: '[name]_v[version]_${{ inputs.asset-platform }}_[arch][ext]'
          releaseId: ${{ inputs.release-id }}
          retryAttempts: 3

      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        env:
          REQUIRE_APPLE_SIGNATURE: ${{ inputs.release-id != '' }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
        run: |
          dmg_path=$(node -e '
            const paths = JSON.parse(process.env.TAURI_ARTIFACT_PATHS);
            const images = paths.filter((path) => path.endsWith(".dmg"));
            if (images.length !== 1) {
              console.error(`Expected one DMG artifact, found ${images.length}.`);
              process.exit(1);
            }
            process.stdout.write(images[0]);
          ')
          scripts/verify-macos-bundle.sh "$dmg_path"

      - name: Upload workflow artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThisIsRAW-${{ inputs.target }}
          path: ${{ join(fromJSON(steps.tauri-build.outputs.artifactPaths), '\n') }}
          if-no-files-found: error
          retention-days: 7
