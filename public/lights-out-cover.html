<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lights Out</title>
    <!-- The backend sets the colour and opacity; the transition matches LIGHTS_OUT_FADE_MS. -->
    <style>
      html {
        height: 100%;
        background: transparent;
      }

      body {
        height: 100%;
        margin: 0;
        background-color: #000000;
        cursor: default;
        opacity: 0;
        transition:
          opacity 300ms ease-in-out,
          background-color 300ms ease-in-out;
      }
    </style>
  </head>
  <body></body>
</html>
